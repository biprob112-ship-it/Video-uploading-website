<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Upload - Biproxx</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body data-page="upload"><header class="topbar"><button class="icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button><a class="brand" href="index.html"><i class="fa-brands fa-youtube"></i><b>Biproxx</b></a><div class="search"><input id="searchInput" placeholder="Search"><button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button></div><div class="top-actions"><a class="icon-btn" href="settings.html"><i class="fa-solid fa-gear"></i></a><a class="avatar" href="channel.html" id="avatar">B</a></div></header>
<main class="content narrow"><div class="page-title"><h1>Upload video</h1><p>Add a video to your Biproxx channel.</p></div><form id="uploadForm" class="form-card"><label>Video file<input id="videoFile" type="file" accept="video/*" required></label><label>Title<input id="videoTitle" maxlength="100" placeholder="Add a title" required></label><label>Description<textarea id="videoDescription" rows="5" placeholder="Tell viewers about your video"></textarea></label><label>Category<select id="videoCategory"><option>Music</option><option>Gaming</option><option>Football</option><option>Coding</option><option>Technology</option><option>News</option><option>Other</option></select></label><label>Thumbnail <span class="muted">(optional)</span><input id="thumbnailFile" type="file" accept="image/*"></label><div class="upload-note"><i class="fa-solid fa-circle-info"></i> For this demo, files are stored locally in your browser. Large videos may exceed browser storage limits.</div><button class="primary" type="submit"><i class="fa-solid fa-upload"></i> Publish</button></form></main><div class="toast" id="toast"></div><script src="js/app.js"></script></body></html>
