<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settings - Biproxx</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body data-page="settings"><header class="topbar"><a class="brand" href="index.html"><i class="fa-brands fa-youtube"></i><b>Biproxx</b></a><div class="search"><input id="searchInput" placeholder="Search"><button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button></div><div class="top-actions"><a class="icon-btn" href="upload.html"><i class="fa-solid fa-video"></i></a><a class="avatar" href="channel.html" id="avatar">B</a></div></header><main class="content narrow"><div class="page-title"><h1>Settings</h1><p>Manage your local Biproxx account.</p></div><form id="settingsForm" class="form-card"><label>Channel name<input id="settingsName" required></label><label>Handle<input id="settingsHandle" placeholder="@creator" required></label><label>Profile initial<input id="settingsAvatar" maxlength="2" required></label><button class="primary" type="submit">Save changes</button></form><div class="form-card danger-card"><h2>Data</h2><p>This demo stores data in your browser using localStorage.</p><button class="danger" id="resetData">Reset all local data</button></div></main><div class="toast" id="toast"></div><script src="js/app.js"></script></body></html>
